
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Code Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Offline Code Translator</h1>

        <div class="selectors">
            <div>
                <label for="sourceLang">Origin language:</label>
                <select id="sourceLang">
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                    <option value="c">C/C++</option>
                    <option value="java">Java</option>
                    <option value="go">Go</option>
                    <option value="sql">SQL</option>
                </select>
            </div>
            <div>
                <label for="targetLang">Destination language:</label>
                <select id="targetLang">
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                    <option value="c">C/C++</option>
                    <option value="java">Java</option>
                    <option value="go">Go</option>
                    <option value="sql">SQL</option>
                </select>
            </div>
            <div class="translate-wrapper">
                <label style="visibility:hidden;">Traduci</label>
                <button id="translateBtn">Translate</button>
                <button id="swapBtn" type="button">Swap languages</button>
            </div>
        </div>

        <div class="editor-container">
            <textarea id="inputCode" placeholder="Scrivi il codice qui..."></textarea>
            <textarea id="outputCode" placeholder="Codice tradotto apparirà qui..." readonly></textarea>
        </div>

        <div class="output-actions"><button id="copyBtn" type="button">Copy result</button><button id="downloadBtn" type="button">Download .txt</button></div>
        <p class="notice">Experimental rule-based converter: it handles only supported patterns and does not preserve every language feature. Review and test generated code before using it.</p>
        <div id="statusBar" role="status" aria-live="polite"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
